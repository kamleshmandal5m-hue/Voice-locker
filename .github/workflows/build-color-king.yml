name: Build Color King APK
on:
  push:
    paths:
      - 'Color-King-Android/**'
      - '.github/workflows/build-color-king.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/cmdline-tools" || true
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon -p Color-King-Android :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: color-king-debug-apk
          path: Color-King-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
