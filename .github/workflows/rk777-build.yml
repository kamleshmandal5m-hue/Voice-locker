name: RK777 Admin APK Build
on:
  push:
    paths:
      - 'RK777/adminapp/**'
      - 'RK777/userapp/**'
      - 'RK777/build.gradle'
      - 'RK777/settings.gradle'
      - 'RK777/gradle.properties'
      - '.github/workflows/rk777-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Admin APK only
        working-directory: RK777
        run: gradle :adminapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RK-777-Admin-APK
          path: RK777/adminapp/build/outputs/apk/debug/*.apk
